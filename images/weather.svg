      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </radialGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
