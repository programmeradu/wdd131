  <!-- Cloud Front -->
  <path d="M46 50 H22 a12 12 0 0 1 -2 -23.8 a16 16 0 0 1 31.4 -3.6 A11 11 0 0 1 46 50 z" fill="url(#cloud-grad)" stroke="#90A4AE" stroke-width="1.5"/>
