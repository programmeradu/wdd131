<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - WDD 131 - Samuel Adu-Berekorang</title>
    <meta name="description" content="A responsive temple picture album featuring modern CSS layouts, hamburger navigation, and dynamic DOM manipulation for WDD 131.">
